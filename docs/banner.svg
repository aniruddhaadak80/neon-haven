<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="NEON HAVEN — open-world crime sandbox">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0118"/>
      <stop offset="55%" stop-color="#120726"/>
      <stop offset="100%" stop-color="#04010d"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff2d95"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1030"/>
      <stop offset="100%" stop-color="#070312"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <!-- Skyline -->
  <g fill="#170b33">
    <rect x="0" y="150" width="70" height="110"/>
    <rect x="80" y="110" width="55" height="150"/>
    <rect x="145" y="165" width="80" height="95"/>
    <rect x="235" y="90" width="48" height="170"/>
    <rect x="293" y="140" width="66" height="120"/>
    <rect x="370" y="120" width="52" height="140"/>
    <rect x="440" y="170" width="90" height="90"/>
    <rect x="545" y="130" width="60" height="130"/>
    <rect x="620" y="95" width="44" height="165"/>
    <rect x="675" y="155" width="75" height="105"/>
    <rect x="765" y="115" width="55" height="145"/>
    <rect x="835" y="168" width="85" height="92"/>
    <rect x="935" y="105" width="50" height="155"/>
    <rect x="998" y="148" width="70" height="112"/>
    <rect x="1080" y="120" width="58" height="140"/>
    <rect x="1150" y="165" width="50" height="95"/>
  </g>
  <!-- Neon windows -->
  <g fill="#00e5ff" opacity="0.75">
    <rect x="94" y="126" width="8" height="10"/><rect x="112" y="150" width="8" height="10"/>
    <rect x="248" y="108" width="8" height="10"/><rect x="262" y="140" width="8" height="10"/>
    <rect x="634" y="112" width="8" height="10"/><rect x="646" y="146" width="8" height="10"/>
    <rect x="948" y="124" width="8" height="10"/><rect x="1094" y="140" width="8" height="10"/>
  </g>
  <g fill="#ff2d95" opacity="0.8">
    <rect x="388" y="138" width="8" height="10"/><rect x="560" y="150" width="8" height="10"/>
    <rect x="780" y="134" width="8" height="10"/><rect x="1016" y="166" width="8" height="10"/>
    <rect x="160" y="184" width="8" height="10"/><rect x="700" y="172" width="8" height="10"/>
  </g>

  <!-- Perspective road -->
  <path d="M 430 320 L 575 250 L 640 250 L 810 320 Z" fill="url(#road)"/>
  <g fill="#ffd75e" opacity="0.85">
    <rect x="603" y="256" width="10" height="14"/>
    <rect x="599" y="278" width="14" height="18"/>
    <rect x="593" y="304" width="20" height="24"/>
  </g>
  <!-- Light streaks -->
  <g stroke-linecap="round" opacity="0.7">
    <line x1="60" y1="290" x2="330" y2="282" stroke="#ff2d95" stroke-width="5"/>
    <line x1="870" y1="278" x2="1150" y2="286" stroke="#00e5ff" stroke-width="5"/>
  </g>

  <!-- Title -->
  <text x="600" y="128" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-size="86" font-weight="900" letter-spacing="6" fill="url(#neon)" filter="url(#glow)">NEON HAVEN</text>
  <text x="600" y="170" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" letter-spacing="12" fill="#c9b8ff">OPEN-WORLD CRIME SANDBOX</text>
  <text x="600" y="212" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="3" fill="#7f74a8">Three.js · Next.js · 100% browser · CC0 art</text>
</svg>
